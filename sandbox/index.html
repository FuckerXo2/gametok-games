<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test player — GameTok Studio</title>
  <link rel="icon" href="/assets/adaptive-icon.png">
  <script src="/session-sso.js"></script>
  <link rel="stylesheet" href="/assets/dev.css">
  <style>
    :root { --card: var(--surface); --blue: var(--accent-strong); --cyan: var(--accent-strong); }
    body { font-size: 14px; }
    .bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .bar h1 { font-size: 16px; margin: 0; letter-spacing: -0.01em; }
    .bar .spacer { flex: 1; }
    button { font: 600 14px var(--font); border-radius: 999px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--border-strong); background: transparent; color: var(--text); }
    button:hover { background: var(--surface-2); }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    button:disabled { opacity: 0.5; cursor: default; }
    main { display: grid; grid-template-columns: minmax(300px, 420px) minmax(0, 1fr); gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
    @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
    .phone { background: #000; border: 1px solid var(--border); border-radius: 22px; overflow: hidden; aspect-ratio: 9 / 16; width: 100%; position: relative; }
    .phone.landscape { aspect-ratio: 16 / 9; }
    /* color-scheme must match the game's (normal), or the browser paints an opaque white
       backdrop behind the frame — and bridge.js makes the game's own background transparent. */
    .phone iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; color-scheme: normal; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 18px; margin-bottom: 16px; }
    .card h2 { font-size: 14px; margin: 0 0 4px; }
    .card p.sub { color: var(--dim); font-size: 12.5px; margin: 0 0 12px; }
    .check { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
    .check .dot { width: 20px; height: 20px; flex: 0 0 20px; border-radius: 50%; border: 1px solid var(--border); display: grid; place-items: center; font-size: 12px; color: var(--dim); }
    .check.done .dot { border-color: var(--green); color: var(--green); }
    .check small { display: block; color: var(--dim); font-size: 12px; }
    #log { font-family: var(--mono); font-size: 12px; background: #030610; border: 1px solid var(--border); border-radius: 10px; padding: 10px; height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
    #log .t { color: var(--dim); }
    #log .in { color: var(--cyan); }
    #log .out { color: var(--green); }
    #log .err { color: var(--red); }
    .notice { padding: 40px 20px; text-align: center; color: var(--dim); }
    code { font-family: var(--mono); font-size: 12px; background: #030610; padding: 1px 5px; border-radius: 5px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap bar">
      <a class="brand" href="/dashboard/"><img src="/assets/adaptive-icon.png" alt=""> <small>←</small></a>
      <h1 id="gameName">Test player</h1>
      <span class="badge badge-test" id="modeBadge">TEST MODE</span>
      <span class="spacer"></span>
      <a href="/docs/#test-mode" class="dim" style="font-size: 14px;">How testing works</a>
      <button class="primary" id="goLiveBtn" onclick="goLive()" hidden>Go live</button>
    </div>
  </header>

  <div id="notice" class="notice">Loading…</div>

  <main id="app" hidden>
    <section>
      <div class="phone" id="phone"><iframe id="gameFrame" title="Game under test" allow="autoplay; fullscreen; clipboard-write"></iframe></div>
      <div class="controls">
        <button onclick="reloadGame()">Reload game</button>
      </div>
      <p style="color: var(--dim); font-size: 12px;">This is the real GameTok player. Only you can see this draft until you click Go live.</p>
    </section>

    <section>
      <div class="card">
        <h2>Activity</h2>
        <p class="sub">What happens in the test player.</p>
        <div id="log"></div>
      </div>
    </section>
  </main>

  <script>
    const API_BASE = 'https://gametok-backend-267787411422.us-central1.run.app/api';
    const gameId = new URLSearchParams(location.search).get('game') || '';
    const token = () => localStorage.getItem('gametok_auth_token') || '';
    const authHeaders = (extra) => ({ ...(extra || {}), Authorization: `Bearer ${token()}` });
    let game = null;
    let gameOrigin = '*';
    const frame = document.getElementById('gameFrame');

    function log(kind, text) {
      const el = document.getElementById('log');
      const line = document.createElement('div');
      const time = new Date().toLocaleTimeString();
      line.innerHTML = `<span class="t">${time}</span> <span class="${kind}"></span>`;
      line.lastChild.textContent = (kind === 'in' ? '← game: ' : kind === 'out' ? '→ game: ' : '') + text;
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
    }

    function showNotice(html) {
      document.getElementById('notice').innerHTML = html;
      document.getElementById('notice').hidden = false;
      document.getElementById('app').hidden = true;
    }

    async function record(event) {
      try {
        const res = await fetch(`${API_BASE}/developer/games/${encodeURIComponent(gameId)}/integration`, {
          method: 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify({ event })
        });
      } catch (e) {}
    }

    async function loadGame() {
      const res = await fetch(`${API_BASE}/developer/games`, { headers: authHeaders() });
      if (res.status === 401) { location.replace('/signin/?next=' + encodeURIComponent(location.pathname + location.search)); return null; }
      const data = await res.json();
      return (data.games || []).find(g => g.id === gameId) || null;
    }

    function reloadGame() {
      frame.src = game.embedUrl;
      log('t', 'reloaded');
    }

    async function answerSessionRequest(requestId) {
      let reply;
      try {
        const res = await fetch(`${API_BASE}/games/${encodeURIComponent(gameId)}/player-session`, { method: 'POST', headers: authHeaders() });
        const data = await res.json();
        reply = res.ok
          ? { type: 'GAMETOK_PLAYER_SESSION', requestId, ok: true, player: data.player, session: data.session, mode: data.mode, expiresIn: data.expiresIn }
          : { type: 'GAMETOK_PLAYER_SESSION', requestId, ok: false, code: data.code || 'SESSION_FAILED', error: data.error };
      } catch (e) {
        reply = { type: 'GAMETOK_PLAYER_SESSION', requestId, ok: false, code: 'NETWORK', error: e.message };
      }
      frame.contentWindow.postMessage(reply, gameOrigin);
      log(reply.ok ? 'out' : 'err', reply.ok
        ? `GAMETOK_PLAYER_SESSION player=${reply.player.id} (${reply.player.name}) mode=${reply.mode} session=${reply.session.slice(0, 16)}…`
        : `GAMETOK_PLAYER_SESSION failed: ${reply.code} ${reply.error || ''}`);
    }

    window.addEventListener('message', (event) => {
      if (event.source !== frame.contentWindow || !event.data || typeof event.data !== 'object') return;
      const data = event.data;
      const type = data.type || '';
      if (!type.startsWith('GAMETOK_')) return;
      const { type: _t, ...rest } = data;
      log('in', `${type} ${JSON.stringify(rest)}`);
      if (type === 'GAMETOK_READY') record('bridge_loaded');
      else if (type === 'GAMETOK_PLAYER_SESSION_REQUEST') { record('player_requested'); answerSessionRequest(data.requestId); }
      else if (type === 'GAMETOK_SCORE') record('score_submitted');
    });

    async function goLive() {
      const btn = document.getElementById('goLiveBtn');
      btn.disabled = true;
      try {
        const res = await fetch(`${API_BASE}/developer/games/${encodeURIComponent(gameId)}/submit`, { method: 'POST', headers: authHeaders() });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
        log('out', `Live at ${data.url}`);
        document.getElementById('modeBadge').className = 'badge badge-live';
        document.getElementById('modeBadge').textContent = 'LIVE';
        btn.hidden = true;
      } catch (e) {
        log('err', 'Go live failed: ' + e.message);
        btn.disabled = false;
      }
    }

    async function start() {
      if (!gameId) { showNotice('No game selected. Open a draft from your <a href="/dashboard/">dashboard</a>.'); return; }
      if (!token() && window.GameTokSSO) {
        const shared = await window.GameTokSSO.get();
        if (shared) localStorage.setItem('gametok_auth_token', shared.token);
      }
      if (!token()) { location.replace('/signin/?next=' + encodeURIComponent(location.pathname + location.search)); return; }
      game = await loadGame();
      if (!game) { showNotice('Game not found in your account. Open it from your <a href="/dashboard/">dashboard</a>.'); return; }

      document.getElementById('gameName').textContent = game.name || game.title || game.id;
      document.title = `Test: ${document.getElementById('gameName').textContent} — GameTok Studio`;
      const isDraft = game.status === 'draft';
      document.getElementById('modeBadge').className = 'badge ' + (isDraft ? 'badge-test' : 'badge-live');
      document.getElementById('modeBadge').textContent = isDraft ? 'TEST MODE' : 'LIVE GAME';
      document.getElementById('goLiveBtn').hidden = !isDraft;
      if (game.orientation === 'landscape') document.getElementById('phone').classList.add('landscape');
      try { gameOrigin = new URL(game.embedUrl).origin; } catch (e) {}
      document.getElementById('notice').hidden = true;
      document.getElementById('app').hidden = false;
      frame.src = game.embedUrl;
      log('t', `loading ${game.embedUrl}`);
      if (!isDraft) log('t', 'This game is already live. Publish a new draft to test changes before players see them.');

    }
    start();
  </script>
</body>
</html>
