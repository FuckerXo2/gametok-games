<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <base href="game/">
    <title>Tomb of the Mask</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="style-game.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #1a1a2e;
            touch-action: none;
        }
        .container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            height: 100%;
            padding: 10px;
        }
        #map-container { 
            display: flex; 
            justify-content: center; 
            align-items: center;
        }
        #map-container canvas {
            max-width: 100%;
            max-height: 70vh;
        }
        .header { display: none; }
        #arrow { display: none; }
        #count-star {
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin-top: 10px;
            font-size: 14px;
        }
        #win-container, #lose-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            z-index: 100;
        }
        #win-container h3, #lose-container h3 {
            font-size: 24px;
            margin: 20px 0;
        }
        #button-win, #button-lose {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            border: none;
            color: #fff;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }
        #first-sep, #second-sep { text-align: center; }
        #first-sep h4 { color: #888; font-size: 14px; }
    </style>

        const STAGE_LEVEL = "4";
        window.localStorage.setItem('map', JSON.stringify(LEVEL_MAP));
        window.localStorage.setItem('stage-level', STAGE_LEVEL);
    </script>
</head>
<body onload="startGame()">
    <div class="container">
        <div class="header">
            <div id="stage-number"><h1>STAGE <span class="stage-level">4</span></h1></div>
            <div id="arrow">&larr;</div>
        </div>
        <div id="map-container"></div>
        <div id="count-star"></div>
    </div>
    <div id="win-container">
        <div id="first-sep"><h3>Nice! 🎉</h3></div>
        <div id="second-sep"></div>
        <span class="stage-level" style="display:none">4</span>
        <button id="button-win">Play Again</button>
    </div>
    <div id="lose-container">
        <h3>Try Again 💀</h3>
        <span class="stage-level" style="display:none">4</span>
        <button id="button-lose" onclick="location.reload()">Retry</button>
    </div>
    <script src="script-game.js"></script>
    <script>
        // Override win/lose to reload instead of navigating away
        const originalWin = window.win;
        window.win = function() {
            winSound.play();
            window.removeEventListener("keydown", getKey);
            setTimeout(function(){
                addStarsToWin();
                document.getElementById('win-container').style.display = "flex";
            }, 100);
        };
        document.getElementById('button-win').onclick = () => location.reload();
        document.getElementById('button-lose').onclick = () => location.reload();
    </script>
</body>
</html>
