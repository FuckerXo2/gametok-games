<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tap Tap — GameTok sample game</title>
  <meta name="description" content="A tiny GameTok sample game: no SDK, just a web page that plays well on phones.">
  <style>
    body { margin: 0; height: 100dvh; display: grid; place-items: center; text-align: center;
           font: 600 20px system-ui, sans-serif; background: #0b1020; color: #fff;
           touch-action: manipulation; user-select: none; -webkit-user-select: none; }
    button { font: inherit; margin: 6px; padding: 16px 30px; border: 0; border-radius: 99px; background: #38bdf8; color: #001; }
    small { display: block; color: #8a97b2; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <main>
    <p>Tap as fast as you can</p>
    <p>Taps: <b id="score">0</b> · Best: <b id="best">0</b></p>
    <button id="tap">Tap!</button>
    <small>No SDK needed: GameTok shows any web game as it is.</small>
  </main>
  <script>
    // A GameTok game is just a web page. What makes it good on phones: a viewport tag,
    // controls that respond to taps, and a light download.
    let score = 0
    const $ = (id) => document.getElementById(id)
    // Storage can be blocked (private mode, some frames): the game must still work without it.
    let best = 0
    try { best = Number(localStorage.getItem('taptap-best') || 0) } catch (e) {}
    $('best').textContent = best

    $('tap').onclick = () => {
      $('score').textContent = ++score
      if (score > best) { best = score; $('best').textContent = best; try { localStorage.setItem('taptap-best', best) } catch (e) {} }
    }
  </script>
</body>
</html>
