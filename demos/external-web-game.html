<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Runner — External Web Game Demo</title>
  <!-- Official GameTok SDK -->
  <script src="/sdk/v1.js" data-game-id="cyber-runner-demo" data-creator-handle="@johndoe"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090e1a;
      --card: #111a2f;
      --border: #1e2c4d;
      --cyan: #38bdf8;
      --green: #22c55e;
      --purple: #a855f7;
      --gold: #f59e0b;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }
    .game-container {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .game-title {
      font-weight: 800;
      font-size: 18px;
      color: var(--cyan);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .player-chip {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--cyan);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-box {
      background: #0a1122;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }
    .stat-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; font-weight: 600; }
    .stat-val { font-size: 18px; font-weight: 800; margin-top: 2px; }
    
    canvas {
      width: 100%;
      height: 220px;
      background: #050811;
      border: 1px solid var(--border);
      border-radius: 12px;
      display: block;
      margin-bottom: 16px;
      touch-action: none;
    }

    .shop-section {
      background: #09101f;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .shop-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .shop-items {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn-buy {
      background: #14223d;
      border: 1px solid #233862;
      color: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .btn-buy:hover {
      background: #1d335c;
      border-color: var(--cyan);
      transform: translateY(-1px);
    }
    .btn-buy .price {
      color: var(--green);
      font-size: 13px;
      font-weight: 800;
    }
    .btn-ad {
      grid-column: span 2;
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid rgba(168, 85, 247, 0.4);
      color: #e9d5ff;
      padding: 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-ad:hover {
      background: rgba(168, 85, 247, 0.25);
    }

    .console-log {
      background: #050811;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #7dd3fc;
      height: 90px;
      overflow-y: auto;
      line-height: 1.5;
    }
    .console-log div { margin-bottom: 3px; }
    .log-success { color: #4ade80; }
    .log-warn { color: #facc15; }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="header-bar">
      <div class="game-title">
        <span>⚡</span> Cyber Runner
      </div>
      <div class="player-chip" id="playerChip">
        <span>●</span> <span id="playerName">Connecting...</span>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat-box">
        <div class="stat-label">Score</div>
        <div class="stat-val" id="scoreVal" style="color: var(--cyan);">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Gems</div>
        <div class="stat-val" id="gemsVal" style="color: var(--purple);">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Coins</div>
        <div class="stat-val" id="coinsVal" style="color: var(--gold);">50</div>
      </div>
    </div>

    <!-- Mini Canvas Game -->
    <canvas id="gameCanvas" width="480" height="220"></canvas>

    <!-- In-App Purchases (GameTok Payments Integration) -->
    <div class="shop-section">
      <div class="shop-title">
        <span>🛒 In-Game Store (GameTok Checkout)</span>
        <span style="font-size: 11px; color: var(--text-dim);">80% Rev-Share</span>
      </div>
      <div class="shop-items">
        <button class="btn-buy" onclick="buyItem('gems_100', '100 Gems Pack', 0.99, 100)">
          <span>💎 100 Gems Pack</span>
          <span class="price">$0.99</span>
        </button>
        <button class="btn-buy" onclick="buyItem('turbo_boost', 'Turbo Hyper Drive', 1.99, 250)">
          <span>🚀 Turbo Hyper Drive</span>
          <span class="price">$1.99</span>
        </button>
        <button class="btn-ad" onclick="watchRewardedAd()">
          <span>📺</span> Watch Video Ad (+25 Coins)
        </button>
      </div>
    </div>

    <!-- Real-time SDK Event Console -->
    <div style="font-size: 11px; font-weight: 700; color: var(--text-dim); margin-bottom: 6px;">
      LIVE GAMETOK SDK LOGS:
    </div>
    <div class="console-log" id="sdkConsole">
      <div>[SDK] Initializing GameTok Web SDK...</div>
    </div>
  </div>

  <script>
    let score = 0;
    let gems = 0;
    let coins = 50;

    function logMsg(text, type) {
      const c = document.getElementById('sdkConsole');
      const row = document.createElement('div');
      if (type === 'success') row.className = 'log-success';
      if (type === 'warn') row.className = 'log-warn';
      const time = new Date().toLocaleTimeString();
      row.textContent = `[${time}] ${text}`;
      c.appendChild(row);
      c.scrollTop = c.scrollHeight;
    }

    // 1. Initialize GameTok SDK & Get Player
    window.addEventListener('DOMContentLoaded', async () => {
      if (window.GameTok) {
        logMsg('GameTok.ready() sent to parent shell', 'success');
        try {
          const p = await window.GameTok.player.getPlayer();
          document.getElementById('playerName').textContent = p.displayName || p.username;
          logMsg(`Signed in: ${p.username} (${p.id})`, 'success');
        } catch (e) {
          logMsg('Guest mode active', 'warn');
          document.getElementById('playerName').textContent = 'Guest Player';
        }
      } else {
        logMsg('GameTok SDK not found', 'warn');
      }
    });

    // 2. In-App Purchase via GameTok Payments
    async function buyItem(itemId, title, amount, gemReward) {
      logMsg(`Calling GameTok.payments.purchase({ itemId: '${itemId}', amount: ${amount} })...`);
      
      try {
        const res = await window.GameTok.payments.purchase({
          itemId: itemId,
          title: title,
          amount: amount,
          currency: 'USD'
        });

        if (res.success) {
          gems += gemReward;
          document.getElementById('gemsVal').textContent = gems;
          logMsg(`✓ Purchase Confirmed! Receipt: ${res.receiptId}`, 'success');
        } else {
          logMsg(`Payment cancelled: ${res.error || 'User dismiss'}`, 'warn');
        }
      } catch (err) {
        logMsg(`Error processing purchase: ${err.message}`, 'warn');
      }
    }

    // 3. Rewarded Video Ad via GameTok Ads
    async function watchRewardedAd() {
      logMsg('Calling GameTok.ads.showRewardedAd()...');
      try {
        const res = await window.GameTok.ads.showRewardedAd();
        if (res.rewarded) {
          coins += 25;
          document.getElementById('coinsVal').textContent = coins;
          logMsg('✓ Video ad watched! Awarded +25 Coins', 'success');
        }
      } catch (e) {
        logMsg('Ad failed or skipped', 'warn');
      }
    }

    // 4. Playable Canvas Game Loop
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let playerX = 60;
    let playerY = 110;
    let particles = [];
    let obstacles = [];

    function spawnObstacle() {
      obstacles.push({ x: canvas.width, y: Math.random() * (canvas.height - 40) + 20, r: 12 });
    }
    setInterval(spawnObstacle, 1400);

    canvas.addEventListener('pointermove', (e) => {
      const rect = canvas.getBoundingClientRect();
      playerY = ((e.clientY - rect.top) / rect.height) * canvas.height;
    });

    function gameLoop() {
      ctx.fillStyle = '#050811';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars
      ctx.fillStyle = '#1e2c4d';
      for (let i = 0; i < 20; i++) {
        ctx.fillRect((i * 37 + score * 2) % canvas.width, (i * 29) % canvas.height, 2, 2);
      }

      // Draw Player Ship
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.moveTo(playerX + 15, playerY);
      ctx.lineTo(playerX - 10, playerY - 9);
      ctx.lineTo(playerX - 5, playerY);
      ctx.lineTo(playerX - 10, playerY + 9);
      ctx.closePath();
      ctx.fill();

      // Obstacles
      ctx.fillStyle = '#f43f5e';
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= 3;
        ctx.beginPath();
        ctx.arc(obs.x, obs.y, obs.r, 0, Math.PI * 2);
        ctx.fill();

        // Pass obstacle
        if (obs.x < -20) {
          obstacles.splice(i, 1);
          score += 10;
          document.getElementById('scoreVal').textContent = score;
          if (score % 50 === 0 && window.GameTok) {
            window.GameTok.leaderboards.submitScore(score);
          }
        }
      }

      requestAnimationFrame(gameLoop);
    }
    gameLoop();
  </script>
</body>
</html>
